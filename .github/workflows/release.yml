name: release

on:
  workflow_dispatch:

# changesets/action needs write access to the repo (to open the release PR
# and tag the release commit) and to GitHub Packages (to publish the
# bumped @zytedata/* packages).
permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Open release PR · publish on merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip the release flow on the version PR's own merge commit.
    if: github.repository == 'zytedata/zyte-design-system'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The built-in GITHUB_TOKEN has the contents/pull-requests/packages
          # write granted by the `permissions:` block above, which is enough
          # for changesets to push the release PR, tag, and publish. (It can't
          # trigger *downstream* workflows from its own commits, which we don't
          # rely on here.)
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@zytedata"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all packages
        run: pnpm -r --filter "./packages/*" run build

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # `pnpm release` runs `pnpm -r --filter ./packages/* build` then
          # `changeset publish`. The build step is also defensive here in
          # case the previous step is cached.
          publish: pnpm run release
          version: pnpm run version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Force changesets/npm publish auth via token instead of OIDC.
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub Packages publishes are private/restricted; npm provenance
          # generation fails there (EUSAGE), so keep this disabled.
          NPM_CONFIG_PROVENANCE: "false"
