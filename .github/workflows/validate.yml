name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: typecheck · lint · tokens:check · dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # Allow `pnpm install` to read @zytedata/* from GitHub Packages once we
          # have published versions; for an unpublished workspace this is a
          # no-op since every cross-package dep is `workspace:*`.
          registry-url: https://npm.pkg.github.com
          scope: "@zytedata"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Build all packages (tsc + tokens-build)
        # @zytedata/ds-* tsc emits dist/foundations.js, then tokens-build emits
        # dist/tokens.{json,css,scss,tailwind.cjs} + dist/design.md. The
        # dashboard build below depends on those artefacts being present.
        run: pnpm -r --filter "./packages/*" run build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Validate token artefacts (tokens-check)
        run: pnpm tokens:check

      - name: Dashboard build smoke
        run: pnpm --filter dashboard run build

  # Production deploy: only on merge/push to main, and only after `validate` passes.
  # Authenticates with VERCEL_TOKEN (a repo secret owned by a Vercel team member),
  # so it runs regardless of who merged the PR — no Vercel account needed to merge,
  # and Git author authorization never gates the deploy. Mirrors zyte-customer-portal.
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'zytedata/zyte-design-system'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # zyte-design-system project on the shared Zyte Vercel team
      # (same team as zyte-customer-portal).
      VERCEL_ORG_ID: team_eBRROw8VaCqyrfvvmfs5ycum
      VERCEL_PROJECT_ID: prj_pgbdauGigDumtqIAW0zF1nJtqX0o
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # vercel build runs the monorepo install/build commands from
      # apps/dashboard/vercel.json (root dir = apps/dashboard), which cd to the
      # repo root, build @zytedata/ds-* packages, then build the dashboard.
      - run: pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
      - run: pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
