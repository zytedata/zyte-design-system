name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: typecheck · lint · tokens:check · dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # Allow `pnpm install` to read @zytedata/* from GitHub Packages once we
          # have published versions; for an unpublished workspace this is a
          # no-op since every cross-package dep is `workspace:*`.
          registry-url: https://npm.pkg.github.com
          scope: "@zytedata"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Build all packages (tsc + tokens-build)
        # @zytedata/ds-* tsc emits dist/foundations.js, then tokens-build emits
        # dist/tokens.{json,css,scss,tailwind.cjs} + dist/design.md. The
        # dashboard build below depends on those artefacts being present.
        run: pnpm -r --filter "./packages/*" run build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Validate token artefacts (tokens-check)
        run: pnpm tokens:check

      - name: Dashboard build smoke
        run: pnpm --filter dashboard run build

  # Production deploy: only on push to main, and only after `validate` passes.
  # Fires the Vercel deploy hook (git deployments are disabled in vercel.json),
  # so a red CI build never triggers a production deploy and PRs never do.
  deploy:
    name: Trigger Vercel deploy hook
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'zytedata/zyte-design-system'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger deploy hook
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
